name = "kb-line-webhook"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
GITHUB_REPO = "spenguinlui/knowledge-garden"
GITHUB_BRANCH = "v5"

# Secrets（wrangler secret put <NAME>）：
#   LINE_CHANNEL_SECRET       — LINE console > Basic settings
#   LINE_CHANNEL_ACCESS_TOKEN — LINE console > Messaging API > 長效 token
#   GITHUB_TOKEN              — fine-grained PAT，僅此 repo Contents RW
#   ALLOWED_LINE_USER_ID      — 自己的 LINE userId（webhook event 的 source.userId）
